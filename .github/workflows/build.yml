name: Build & Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Check that the committed watchface.xml matches the generator output,
      # and generate preview images on CI (so the build works even without committed PNGs)
      - name: Generate watch face resources
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter
          pip install pillow
          python3 tools/generate.py
          git diff --exit-code -- watchface/src/main/res/raw watchface/src/main/res/values watchface/src/main/res/values-ja

      # Validate against the XSD with Google's official Watch Face Format validator
      - name: Build official WFF validator
        run: |
          git clone --depth 1 https://github.com/google/watchface.git "$RUNNER_TEMP/watchface"
          cd "$RUNNER_TEMP/watchface/third_party/wff"
          ./gradlew --no-daemon -q :specification:validator:executable-jar

      - name: Validate watchface.xml (WFF v1)
        run: |
          java -jar "$RUNNER_TEMP/watchface/third_party/wff/specification/validator/build/libs/wff-validator.jar" \
            1 watchface/src/main/res/raw/watchface.xml

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK / AAB
        run: gradle --no-daemon :watchface:assembleDebug :watchface:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: meridian-watchface
          path: |
            watchface/build/outputs/apk/debug/*.apk
            watchface/build/outputs/bundle/release/*.aab
